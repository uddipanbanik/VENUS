# Small finite example: increase resolution and duration for a scientific run.
[physics]
physics_model = boltzmann_poisson
vp_universe = static
vp_poisson_source = total_density
vp_gravity = 1
[grid]
Nr = 12
Nw = 12
NL = 8
r_min = 0.1
r_max = 10
radial_grid = log
w_max = 3
L_max = 4
kinetic_grid = legacy_nodal
vp_interpolation = raw
[initial_data]
initial_data = analytic
shell_initial_df = true
gaussian_density_shell = true
R0 = 3
dR = 1
beta = 2
amp = 0.0001
w_in = -0.1
[boundaries]
inner_boundary = reflecting
outer_boundary = reflecting
momentum_boundary = outflow_vacuum
[time]
t_end = 0.002
dt_max = 0.001
max_steps = 10000
[collisions]
bp_collision_operator = spherical_dsmc
bp_cross_section = powerlaw
bp_collision_strength = 0.01
bp_sigma0 = 0.001
bp_subhalo_mass = 0.002
bp_subhalo_radius = 0.05
bp_coulomb_log = 3
bp_bath = instantaneous_df
bp_coeff_table_points = 8
bp_coeff_speed_points = 8
bp_coeff_mu_points = 4
bp_dsmc_particles = 2048
[output]
save_every = 1
phase_every = 1
restart_every = 1
[parallelism]
threads = 2
