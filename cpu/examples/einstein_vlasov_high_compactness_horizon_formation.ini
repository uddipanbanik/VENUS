# Einstein-Vlasov high-compactness binary-IC example.
#
# The included binary initial condition has an initial minimum metric gap
# around 0.1.  It is therefore a near-collapse Einstein-Vlasov configuration,
# not a low-compactness halo example.
#
# Command-line and environment overrides:
#   srun --ntasks=8 ./venus_cpu_einstein_vlasov_eulerian_mpi --config params_cluster.ini --output-dir /path/to/scratch/$USER/run01
#   EV_CONFIG=/path/to/input.ini EV_OUTPUT_DIR=/path/to/output EV_THREADS=8 srun --ntasks=8 ./venus_cpu_einstein_vlasov_eulerian_mpi

# Read f(r,w,L) and its coordinate arrays from the supplied binary.
# Keep its amplitude because mass normalization is disabled.
[initial_data]
initial_data = binary_rwl
initial_data_file = initial_data/example_shell_rwl.bin
custom_ic_normalize_mass = false
custom_ic_target_mass = 1.0e-2

[grid_for_analytic_initial_data]
# Ignored for binary_rwl, except for restart compatibility metadata.
Nr = 260
Nw = 240
NL = 48
r_min = 1.0e-3
r_max = 60.0
radial_grid = log
inner_refine_radius = 0.1
inner_refine_cells = 96
w_max = 8.0
L_max = 6.0
w_stretch = 2.5
w_center = 0.0

# Keep the imported momentum grid fixed. The binary restart format used
# here does not save an independently remapped custom momentum grid.
[adaptive_w]
adaptive_w = false
adaptive_w_every = 20
adaptive_w_trigger = 0.65
adaptive_w_margin = 1.8
adaptive_w_growth = 1.6
adaptive_w_max = 0.0

# Trace characteristics backward with kick-drift-kick. The chosen interval
# is bounded by both the radial/momentum CFL estimate and dt_max.
[time_integration]
integrator = semi_lagrangian_kick_drift_kick
t_end = 0.2
cfl = 0.35
dt_max = 0.01
max_steps = 2000

# Mirror radial momentum at the inner radius. Departure points beyond
# the outer radial or momentum domain sample vacuum.
[boundaries]
inner_boundary = reflecting
outer_boundary = outflow_vacuum
momentum_boundary = outflow_vacuum
central_mass = 0.0

# Solve the Einstein constraints from the distribution. metric_floor
# protects metric evaluation, while gap_stop independently stops the evolution
# when the measured minimum of 1-2m/r reaches the specified value.
[metric_and_stopping]
initial_metric_iters = 4
metric_floor = 1.0e-10
gap_stop = 2.0e-5
active_floor_rel = 1.0e-12
active_floor_abs = 0.0
f_floor = 0.0

# These seed parameters apply when initial_data=analytic. The binary
# input selected above supplies the distribution for this example.
[analytic_initial_data]
shell_initial_df = false
R0 = 5.0
dR = 1.0
top_hat_shell = false
top_hat_density_shell = false
gaussian_density_shell = false
double_gaussian_density_shell = false
R0_2 = 10.0
dR_2 = 1.0
amp_2 = 1.0e-2
w_in_2 = -1.0
beta = 4.0
amp = 1.0e-2
w_in = -0.6

# Save radial moments and metric profiles, together with projected
# phase-space samples. Cadences count accepted steps. restart_every=0
# disables periodic restarts, and the solver still writes its final state.
[output]
output_dir = ../../output/cpu/examples/ev_high_compactness_horizon_formation
save_every = 5
phase_every = 5
phase_r_stride = 1
phase_w_stride = 1
restart_every = 0
restart_from = ""

[parallelism]
# Per-rank OpenMP threads. 0 means auto from EV_THREADS, OMP_NUM_THREADS,
# SLURM_CPUS_PER_TASK, then hardware.
threads = 0

# Used only by the non-MPI executable.  The MPI executable accepts multi-rank
# launches and decomposes f(r,w,L) into L slabs.
allow_multi_rank_launch = false
