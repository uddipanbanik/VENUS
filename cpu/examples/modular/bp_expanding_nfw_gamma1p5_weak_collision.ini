# Expanding EdS weak-collision example for an NFW-like outer halo.
#
# Numerical choices:
#   * semi-Lagrangian Vlasov advection for the cold angular-supported halo;
#   * conservative Chang-Cooper/RKL2 collision substep;
#   * softened subhalo encounters with n_eff ~ 0 inside and ~3.3 outside;
#   * t_coll ~ 20 initially, so t=5 samples weak but nonzero relaxation.

# The EdS scale factor varies as (t+time_offset)^alpha. Poisson uses
# density contrast, and the transport includes the corresponding Hubble terms.
[physics]
physics_model = boltzmann_poisson
vp_universe = expanding
vp_alpha = 0.6666666666666666
vp_time_offset = 12.0
vp_gravity = 1.0
vp_poisson_source = density_contrast

# Approximate cumulative small deflections with a Fokker-Planck operator.
# softened_gravity sets the velocity-dependent gravitational encounter law.
# instantaneous_df obtains the partner distribution from the evolving f.
# Chang-Cooper fluxes and RKL2 stages advance the collision substeps.
[collisions]
bp_collision_operator = fokker_planck
bp_cross_section = softened_gravity
bp_bath = instantaneous_df
bp_collision_strength = 2.0
bp_sigma0 = 0.0
bp_subhalo_mass = 0.002
bp_subhalo_radius = 0.05
bp_coulomb_log = 3.0
bp_temperature_floor = 1.0e-8
bp_density_floor_abs = 0.0
bp_density_floor_rel = 1.0e-8
bp_partner_mass_tol = 0.0
bp_bath_speed_cutoff = 5.0
bp_coeff_table_points = 8
bp_coeff_speed_points = 8
bp_coeff_mu_points = 6
bp_coeff_refresh_every = 1
bp_coeff_refresh_mode = collision_time
bp_coeff_refresh_chi = 0.5
bp_coeff_refresh_time_quantile = 0.0
bp_collision_apply_every = 1
bp_collision_cfl = 0.20
bp_collision_max_substeps = 300
bp_collision_flux = chang_cooper
bp_collision_integrator = sts_rkl2
bp_collision_splitting = strang
bp_sts_max_stages = 100
bp_collision_l_min_rel = 0.002

# Import the discrete initial distribution without rescaling its mass.
# Its binary file supplies the radial and momentum coordinates.
[initial_data]
initial_data = binary_rwl
initial_data_file = ../initial_data/bp_zero_flux_b4o3_gamma1p5_eds_R20_rmin0p1_W3_L8_Nr128_Nw160_NL72_discrete.bin
custom_ic_normalize_mass = false

[grid_for_binary_initial_data]
Nr = 128
Nw = 160
NL = 72
r_min = 0.10
r_max = 20.0
radial_grid = custom
custom_radial_coordinate = log
w_max = 3.0
L_max = 8.0
w_stretch = 0.0
w_center = 0.0

[adaptive_w]
adaptive_w = false
adaptive_w_every = 20
adaptive_w_trigger = 0.70
adaptive_w_margin = 1.8
adaptive_w_growth = 1.5
adaptive_w_max = 5.0

# Strang splitting places collision substeps around collisionless
# characteristic transport. dt_max bounds the global interval, while the
# collision CFL and maximum substeps also constrain collision integration.
[time_integration]
integrator = semi_lagrangian_kick_drift_kick
t_end = 5.0
cfl = 0.28
dt_max = 0.015
max_steps = 300000

[boundaries]
inner_boundary = origin_parity
outer_boundary = reflecting
momentum_boundary = outflow_vacuum
central_mass = 0.0

[metric_and_stopping]
initial_metric_iters = 0
metric_floor = 1.0e-10
gap_stop = 2.0e-5
active_floor_rel = 1.0e-5
active_floor_abs = 0.0
f_floor = 0.0

[output]
output_dir = ../../../output/cpu/examples/bp_expanding_gamma1p5_weak_collision
restart_dir = ../../../output/cpu/examples/bp_expanding_gamma1p5_weak_collision/restarts
save_every = 20
phase_every = 0
phase_r_stride = 1
phase_w_stride = 2
restart_every = 100
restart_from = ""

[parallelism]
threads = 10
