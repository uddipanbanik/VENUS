# Static Boltzmann-Poisson SIDM core-collapse example with a closed outer wall.

# Evolve a static halo under its own total-density gravitational field.
# vp_alpha and vp_time_offset are expansion parameters and remain inactive
# for the selected static background.
[physics]
physics_model = boltzmann_poisson
vp_universe = static
vp_alpha = 0.6666666666666666
vp_time_offset = 1.0
vp_gravity = 1.0
vp_poisson_source = total_density

# Use the Yukawa Born cross section specified by alpha, mchi and mphi.
# The Fokker-Planck coefficients use a local Maxwellian partner distribution.
# Refreshing the coefficients every 5 steps approximates their time variation
# between refreshes, while the collision CFL controls the substeps.
[collisions]
bp_collision_operator = fokker_planck
bp_cross_section = yukawa_born
bp_bath = local_maxwellian
bp_collision_strength = 9.025
bp_yukawa_alpha = 0.05
bp_yukawa_mchi = 1.0
bp_yukawa_mphi = 0.3
bp_temperature_floor = 1.0e-10
bp_density_floor_abs = 0.0
bp_density_floor_rel = 1.0e-13
bp_partner_mass_tol = 0.0
bp_bath_speed_cutoff = 6.0
bp_coeff_table_points = 24
bp_coeff_speed_points = 16
bp_coeff_mu_points = 12
bp_coeff_refresh_every = 5
bp_collision_apply_every = 1
bp_collision_cfl = 0.22
bp_collision_max_substeps = 600

# Load the spherical halo distribution and its grids from the binary
# file. Its normalization supplies the physical mass for this example.
[initial_data]
initial_data = binary_rwl
initial_data_file = ../initial_data/sidm_nfw_yukawa_corecollapse_R100.bin
custom_ic_normalize_mass = false

[grid_for_binary_initial_data]
Nr = 160
Nw = 144
NL = 96
r_min = 1.0e-3
r_max = 100.0
radial_grid = custom
custom_radial_coordinate = log
w_max = 1.0
L_max = 12.0
w_stretch = 0.0
w_center = 0.0

[adaptive_w]
adaptive_w = false

# Conservative finite-volume transport advances the cell distribution.
# The CFL limit resolves positive-donor fluxes through phase-space faces.
# dt_max supplies an additional upper bound on each interval.
[time_integration]
integrator = conservative_finite_volume
t_end = 22.54
cfl = 0.35
dt_max = 0.02
max_steps = 500000

[boundaries]
inner_boundary = origin_parity
outer_boundary = reflecting
momentum_boundary = outflow_vacuum
central_mass = 0.0

[metric_and_stopping]
initial_metric_iters = 0
metric_floor = 1.0e-10
gap_stop = 2.0e-5
active_floor_rel = 1.0e-7
active_floor_abs = 0.0
f_floor = 0.0

[output]
output_dir = ../../../output/cpu/examples/bp_sidm_nfw_yukawa_core_collapse
restart_dir = ../../../output/cpu/examples/bp_sidm_nfw_yukawa_core_collapse/restarts
save_every = 25
phase_every = 0
phase_r_stride = 1
phase_w_stride = 4
restart_every = 200
restart_from = ""

[parallelism]
threads = 10
