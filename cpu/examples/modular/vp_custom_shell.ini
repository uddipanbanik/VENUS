# Static collisionless shell supplied by examples/user_distribution.py.
# First generate output/cpu/custom_shell/initial.bin with the README command.
# Input/output paths are relative to this INI file. The binary owns its grids.

# Evolve the user-supplied distribution under its own Poisson field in a
# static background. The solver computes the density by integrating f over
# momentum and then reconstructs the enclosed mass and radial force.
[physics]
physics_model = vlasov_poisson
vp_universe = static
vp_gravity = 1.0
vp_poisson_source = total_density

# Keep the collision operator disabled. All changes in f come from
# collisionless transport through the time-dependent self-gravitating field.
[collisions]
bp_collision_operator = none
bp_collision_strength = 0.0

# The generated binary supplies f and its coordinate arrays. Preserve
# its mass normalization so the generator and solver describe the same IC.
[initial_data]
initial_data = binary_rwl
initial_data_file = ../../../output/cpu/custom_shell/initial.bin
custom_ic_normalize_mass = false

[grid_for_binary_initial_data]
Nr = 64
Nw = 64
NL = 32
r_min = 0.1
r_max = 20.0
radial_grid = custom
custom_radial_coordinate = log
w_max = 2.0
L_max = 4.0

[time_integration]
integrator = semi_lagrangian_kick_drift_kick
t_end = 1.0
cfl = 0.25
dt_max = 0.01
max_steps = 100000

[boundaries]
inner_boundary = origin_parity
outer_boundary = outflow_vacuum
momentum_boundary = outflow_vacuum
central_mass = 0.0

# Save profiles and phase-space projections every 10 accepted steps.
# A restart every 50 steps contains the full distribution and its time.
[output]
output_dir = ../../../output/cpu/custom_shell/run
save_every = 10
phase_every = 10
phase_r_stride = 1
phase_w_stride = 1
restart_every = 50
restart_from = ""

[parallelism]
threads = 2
