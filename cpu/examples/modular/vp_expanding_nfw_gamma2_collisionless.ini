# Collisionless expanding EdS example initialized from a rho ~ r^{-2} seed.

# Use an EdS background with H=alpha/(t+time_offset). The imported
# distribution evolves under its density-contrast Poisson field and Hubble
# terms in the peculiar-velocity characteristics.
[physics]
physics_model = vlasov_poisson
vp_universe = expanding
vp_alpha = 0.6666666666666666
vp_time_offset = 12.0
vp_gravity = 1.0
vp_poisson_source = density_contrast

# bp_collision_operator=none and zero strength disable encounters.
# The remaining cross-section parameters carry no collision evolution here.
[collisions]
bp_collision_operator = none
bp_cross_section = softened_gravity
bp_bath = instantaneous_df
bp_collision_strength = 0.0

# Import the discrete gamma=2 distribution and its coordinate arrays.
# Its normalization is retained so its field agrees with the supplied IC.
[initial_data]
initial_data = binary_rwl
initial_data_file = ../initial_data/bp_zero_flux_b1_gamma2_eds_R20_rmin0p1_W3_L8_Nr128_Nw160_NL72_quadL_discrete.bin
custom_ic_normalize_mass = false

[grid_for_binary_initial_data]
Nr = 128
Nw = 160
NL = 72
r_min = 0.10
r_max = 20.0
radial_grid = custom
custom_radial_coordinate = log
w_max = 3.0
L_max = 8.0
w_stretch = 0.0
w_center = 0.0

[adaptive_w]
adaptive_w = false
adaptive_w_every = 20
adaptive_w_trigger = 0.70
adaptive_w_margin = 1.8
adaptive_w_growth = 1.5
adaptive_w_max = 5.0

[time_integration]
integrator = semi_lagrangian_kick_drift_kick
t_end = 10.0
cfl = 0.28
dt_max = 0.015
max_steps = 1500000

# Origin parity continues an inward characteristic through r=0 with
# reversed radial direction. A reflecting outer wall retains radial matter
# within the finite domain. Momentum outflow still needs its own budget.
[boundaries]
inner_boundary = origin_parity
outer_boundary = reflecting
momentum_boundary = outflow_vacuum
central_mass = 0.0

[metric_and_stopping]
initial_metric_iters = 0
metric_floor = 1.0e-10
gap_stop = 2.0e-5
active_floor_rel = 1.0e-5
active_floor_abs = 0.0
f_floor = 0.0

[output]
output_dir = ../../../output/cpu/examples/vp_expanding_gamma2_collisionless
restart_dir = ../../../output/cpu/examples/vp_expanding_gamma2_collisionless/restarts
save_every = 100
phase_every = 0
phase_r_stride = 1
phase_w_stride = 2
restart_every = 500
restart_from = ""

[parallelism]
threads = 6
