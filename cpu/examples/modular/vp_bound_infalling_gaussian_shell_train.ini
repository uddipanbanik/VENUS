# Collisionless self-gravitating infalling-shell example.

# Advance collisionless matter in the static gravitational field of its
# total density. bp_collision_operator=none leaves the collision term zero.
[physics]
physics_model = vlasov_poisson
vp_universe = static
vp_alpha = 0.6666666666666666
vp_time_offset = 1.0
vp_gravity = 1.0
vp_poisson_source = total_density
bp_collision_operator = none

# Read the bound infalling-shell distribution from the binary file.
# Its radial and velocity support is part of the initial condition.
[initial_data]
initial_data = binary_rwl
initial_data_file = ../initial_data/selfgrav_infall_shells.bin
custom_ic_normalize_mass = false

[grid_for_binary_initial_data]
Nr = 168
Nw = 192
NL = 40
r_min = 0.06
r_max = 20.0
radial_grid = custom
custom_radial_coordinate = log
w_max = 2.0
L_max = 2.6
w_stretch = 0.0
w_center = 0.0

[adaptive_w]
adaptive_w = false

# Use conservative finite-volume fluxes in phase space. The CFL fraction
# bounds transport through a cell, and dt_max supplies a second upper limit.
[time_integration]
integrator = conservative_finite_volume
t_end = 3.0
cfl = 0.42
dt_max = 0.015
max_steps = 160000

# The inner radial wall reflects incoming material. Outer radial and
# momentum boundaries permit outflow into vacuum, so monitor their loss
# diagnostics when interpreting the retained mass and energy.
[boundaries]
inner_boundary = reflecting
outer_boundary = outflow_vacuum
momentum_boundary = outflow_vacuum
central_mass = 0.0

[metric_and_stopping]
initial_metric_iters = 0
metric_floor = 1.0e-10
gap_stop = 2.0e-5
active_floor_rel = 1.0e-6
active_floor_abs = 0.0
f_floor = 0.0

[output]
output_dir = ../../../output/cpu/examples/vp_bound_infalling_shell_train
restart_dir = ../../../output/cpu/examples/vp_bound_infalling_shell_train/restarts
save_every = 10
phase_every = 0
phase_r_stride = 1
phase_w_stride = 3
restart_every = 500
restart_from = ""

[parallelism]
threads = 8
