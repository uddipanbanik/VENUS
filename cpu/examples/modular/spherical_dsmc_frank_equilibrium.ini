# Resolved short SphDSMC example based on the supplied Frank equilibrium.
# Run from the cpu directory after `make serial`.

# Use conservative Hamiltonian transport in the static self-gravitating
# field. Orbit regularization resolves passages with rapid angular motion
# while the energy tolerance checks the characteristic integration.
[physics]
physics_model = boltzmann_poisson
vp_universe = static
vp_gravity = 1.0
vp_poisson_source = total_density
vp_interpolation = hamiltonian_conservative
vp_orbit_regularization = auto
vp_orbit_energy_tolerance = 0.01
vp_orbit_lc_relative_tolerance = 1e-9
vp_orbit_lc_absolute_tolerance = 1e-12
vp_orbit_lc_max_steps = 2048
vp_orbit_lc_max_refinements = 2

# Draw representative particles from the imported distribution, sort
# their indices by current radius, and group neighboring particles into
# encounter shells. The constant isotropic cross section sets pair rates.
# The collision epsilon limits encounter probability per collision interval.
[collisions]
bp_collision_operator = spherical_dsmc
bp_cross_section = constant
bp_boltzmann_kernel = isotropic
# A 0.3 multiplier keeps the introductory 50,000-marker collision shells
# comfortably narrower than their measured mean free paths.
bp_collision_strength = 0.3
bp_sigma0 = 32.354198286197665
bp_dsmc_particles = 50000
bp_dsmc_shell_particles = 1024
bp_dsmc_min_shell_particles = 32
bp_dsmc_collision_epsilon = 0.1
bp_dsmc_gravity_eta = 0.01
bp_dsmc_seed = 5489

# Import the supplied equilibrium distribution without changing its
# normalization. The short evolution checks its response to collisions.
[initial_data]
initial_data = binary_rwl
initial_data_file = ../initial_data/frank_core_eq2_r1e3_model1e6_originlinear_Nr64_Nw32_NL40.bin
custom_ic_normalize_mass = false

[time_integration]
integrator = semi_lagrangian_kick_drift_kick
t_end = 0.05
dt_max = 0.01
max_steps = 1000000

[boundaries]
inner_boundary = origin_parity
outer_boundary = reflecting
momentum_boundary = outflow_vacuum
central_mass = 0.0

# Write a radial profile at every saved step and a full restart every 5.
# The restart retains the random state needed to continue the DSMC sampling.
[output]
output_dir = ../../../output/cpu/examples/spherical_dsmc_frank_equilibrium
restart_dir = ../../../output/cpu/examples/spherical_dsmc_frank_equilibrium/restarts
save_every = 1
phase_every = 0
restart_every = 5

[parallelism]
threads = 8
