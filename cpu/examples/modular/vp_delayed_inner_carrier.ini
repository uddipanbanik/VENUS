# Compact Vlasov-Poisson example of delayed passage through 0 < r < r_min.

[physics]
physics_model = vlasov_poisson
vp_universe = static
vp_gravity = 1.0
vp_poisson_source = total_density
bp_collision_operator = none

# Store cell averages in eta=L^2/2. Four-point quadrature integrates
# the initial distribution inside cells. Hamiltonian SLDG transports these
# averages using orbit geometry and conservative overlap integrals.
[fully_kinetic_grid]
kinetic_grid = cell_average_eta
kinetic_eta_grid = power
kinetic_eta_power = 3.0
kinetic_ic_quadrature_points = 4
vp_interpolation = hamiltonian_sldg

# Place a narrow density shell just outside the inner grid radius.
# Its negative radial momentum carries matter into the unresolved interior.
[initial_data]
initial_data = analytic
custom_ic_normalize_mass = false
shell_initial_df = true
gaussian_density_shell = true
R0 = 0.14
dR = 0.018
beta = 24.0
amp = 1.0e-4
w_in = -1.0

[grid]
Nr = 16
Nw = 16
NL = 8
r_min = 0.1
r_max = 2.0
radial_grid = log
w_max = 2.0
L_max = 0.12
w_stretch = 0.0
w_center = 0.0

# Follow the orbit through the unresolved region with finite-duration
# packets. The packet retains mass and flight time until it returns.
# Quadrature/refinement controls set how accurately these returning packets
# represent the distribution. Packet limits stop excessive unresolved work.
[transport]
integrator = semi_lagrangian_kick_drift_kick
vp_timestep_mode = frank_dynamical
vp_dynamical_eta = 0.02
vp_potential_variation_eta = 0.1
vp_orbit_regularization = auto
vp_orbit_energy_tolerance = 1.0e-7
vp_orbit_lc_relative_tolerance = 1.0e-9
vp_orbit_lc_absolute_tolerance = 1.0e-11
vp_orbit_lc_max_steps = 20000
vp_sldg_subcells = 2
vp_sldg_max_refinement = 12
vp_sldg_max_work_per_subcell = 32768
vp_sldg_fallback_mass_tolerance = 1.0e-8
vp_inner_carrier_quadrature_points = 4
vp_inner_carrier_max_refinement = 6
vp_inner_carrier_max_orbit_segments = 16
vp_inner_carrier_max_packets = 2000000
vp_inner_carrier_mass_tolerance = 1.0e-12

[time]
t_end = 0.04
dt_max = 0.02
cfl = 0.35
max_steps = 1000

# delayed_return continues the interior orbit instead of reflecting it
# immediately at r_min. The outer radial wall remains reflecting.
[boundaries]
inner_boundary = delayed_return
outer_boundary = reflecting
momentum_boundary = outflow_vacuum
central_mass = 0.0

[diagnostics]
initial_metric_iters = 0
metric_floor = 1.0e-10
gap_stop = 2.0e-5
active_floor_rel = 1.0e-12
active_floor_abs = 0.0
f_floor = 0.0

[output]
output_dir = ../../../output/cpu/examples/vp_delayed_inner_carrier
restart_dir = ../../../output/cpu/examples/vp_delayed_inner_carrier/restarts
save_every = 1
phase_every = 0
restart_every = 2
restart_from = ""

[parallelism]
threads = 2
