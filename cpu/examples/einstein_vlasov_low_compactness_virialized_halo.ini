# Einstein-Vlasov low-compactness virializing shell/halo example.
#
# This analytic lightweight example uses a broad, inward-moving shell with
# small amplitude, so the metric gap stays far from horizon formation.

# Construct an analytic distribution, then obtain its metric from the
# matter moments. The shell amplitude sets the initial matter scale.
[initial_data]
initial_data = analytic
custom_ic_normalize_mass = false

# Use a logarithmic radial grid and a symmetric stretched momentum grid.
# L is angular momentum, with tangential momentum L/r at each radius.
[grid_for_analytic_initial_data]
Nr = 160
Nw = 160
NL = 40
r_min = 1.0e-2
r_max = 80.0
radial_grid = log
inner_refine_radius = 0.2
inner_refine_cells = 64
w_max = 5.0
L_max = 8.0
w_stretch = 2.0
w_center = 0.0

[adaptive_w]
adaptive_w = false

[time_integration]
integrator = semi_lagrangian_kick_drift_kick
t_end = 20.0
cfl = 0.35
dt_max = 0.04
max_steps = 200000

[boundaries]
inner_boundary = reflecting
outer_boundary = outflow_vacuum
momentum_boundary = outflow_vacuum
central_mass = 0.0

# Iterate the analytic seed and Einstein constraints four times. Monitor
# the true metric gap separately from its evaluation floor.
[metric_and_stopping]
initial_metric_iters = 4
metric_floor = 1.0e-10
gap_stop = 2.0e-5
active_floor_rel = 1.0e-12
active_floor_abs = 0.0
f_floor = 0.0

# Set a Gaussian density shell centered at R0 with radial width dR.
# beta controls the momentum width, and negative w_in supplies inward motion.
[analytic_initial_data]
shell_initial_df = true
gaussian_density_shell = true
R0 = 18.0
dR = 4.0
beta = 3.0
amp = 2.0e-4
w_in = -0.35

# Write radial profiles every 20 steps and phase projections every 50.
# Complete restarts every 200 steps retain the full f array and physical time.
[output]
output_dir = ../../output/cpu/examples/ev_low_compactness_virialized_halo
save_every = 20
phase_every = 50
phase_r_stride = 1
phase_w_stride = 2
restart_every = 200
restart_from = ""

[parallelism]
threads = 0
allow_multi_rank_launch = false
